  <!-- Note content -->
  <g class="font">
    <text x="458" y="310" class="tiny muted">CHAPTER 01  ·  CORE NOTE</text>
    <text x="458" y="356" class="ink" font-size="35" font-weight="800">导数：函数变化的速度</text>
    <text x="458" y="392" class="body" font-weight="700">教材：</text><text x="520" y="392" class="body ink">高等数学（第八版）</text>
    <text x="458" y="424" class="body" font-weight="700">学习目标：</text><text x="554" y="424" class="body ink">理解定义、几何意义与基本应用</text>

    <rect x="458" y="458" width="780" height="111" rx="14" fill="#f7f8ff" stroke="#ecebff"/>
    <circle cx="493" cy="493" r="14" fill="#f7d978"/><text x="493" y="499" text-anchor="middle" font-size="16">!</text>
    <text x="522" y="496" class="ink" font-size="21" font-weight="700">一句话理解</text>
    <text x="522" y="531" class="body ink">导数描述函数在某一点附近的瞬时变化率，</text>
    <text x="522" y="557" class="body ink">也可以理解为曲线在该点切线的斜率。</text>

    <text x="458" y="615" class="ink" font-size="23" font-weight="800">核心公式</text>
    <rect x="458" y="636" width="780" height="86" rx="12" fill="#fffaf0" stroke="#f3e4bd"/>
    <text x="848" y="692" text-anchor="middle" class="serif" fill="#202638" font-size="29">f′(x) = lim   [ f(x + h) − f(x) ] / h</text>
    <text x="676" y="678" class="serif" fill="#202638" font-size="15">h→0</text>
    <text x="458" y="750" class="muted" font-size="14">记忆：先看“变化量”，再除以“自变量变化量”，最后取极限。</text>

    <text x="458" y="800" class="ink" font-size="23" font-weight="800">知识关系</text>
    <rect x="458" y="819" width="780" height="140" rx="15" fill="url(#diagram)" stroke="#dceff1"/>
    <rect x="458" y="819" width="780" height="140" rx="15" fill="url(#grid)" opacity=".7"/>
    <circle cx="847" cy="889" r="38" fill="#fff" stroke="#5eabb2" stroke-width="3"/>
    <text x="847" y="884" text-anchor="middle" class="ink" font-size="16" font-weight="700">导数</text>
    <text x="847" y="904" text-anchor="middle" class="muted" font-size="12">核心概念</text>
    <rect x="490" y="850" width="146" height="48" rx="12" fill="#fff" stroke="#b8dfe2"/><text x="563" y="880" text-anchor="middle" class="ink" font-size="15" font-weight="700">极限</text>
    <rect x="1056" y="850" width="146" height="48" rx="12" fill="#fff" stroke="#c9c2f9"/><text x="1129" y="880" text-anchor="middle" class="ink" font-size="15" font-weight="700">切线斜率</text>
    <rect x="490" y="914" width="146" height="28" rx="10" fill="#fff" stroke="#f0d8a2"/><text x="563" y="933" text-anchor="middle" class="muted" font-size="13">连续性</text>
    <rect x="1056" y="914" width="146" height="28" rx="10" fill="#fff" stroke="#f0d8a2"/><text x="1129" y="933" text-anchor="middle" class="muted" font-size="13">单调性</text>
    <path d="M636 874H798" stroke="#6b9ca6" stroke-width="2" marker-end="url(#arrow)"/><path d="M896 874H1054" stroke="#6b9ca6" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M636 925H798" stroke="#b9a269" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M896 925H1054" stroke="#b9a269" stroke-width="1.8" marker-end="url(#arrow)"/>
