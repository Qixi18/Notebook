      <stop offset="0" stop-color="#7669ff"/>
      <stop offset="1" stop-color="#5a8df7"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffefd"/>
      <stop offset="1" stop-color="#fbfcff"/>
