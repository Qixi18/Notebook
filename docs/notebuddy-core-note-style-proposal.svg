      <path d="M18.3 2.5V5M17 3.75H19.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
    <style>
      .font { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
