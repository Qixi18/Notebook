<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">NoteBuddy 核心笔记前端视觉方案</title>
  <desc id="desc">参考核心笔记样式的课程学习工作区，包含左侧导航、笔记大纲、核心笔记、知识关系图和右侧问答伙伴。</desc>

  <defs>
