    <linearGradient id="diagram" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#effbfb"/>
      <stop offset="1" stop-color="#edf2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f5b7a" flood-opacity=".10"/>
